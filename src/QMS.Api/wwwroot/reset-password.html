<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — QGo</title>
  <style>
    :root { --navy: #04336b; --navy2: #1e4a8c; --bg: #f4f1eb; --card: #fff; --border: #e2e8f0; --muted: #64748b; --err: #b91c1c; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; min-height: 100vh; background: var(--bg); color: #0f172a; padding: 24px 16px 40px; }
    .card { max-width: 400px; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 28px 24px 32px; box-shadow: 0 8px 32px rgba(4, 51, 107, 0.08); border: 1px solid var(--border); }
    h1 { font-size: 1.35rem; margin: 0 0 8px; color: var(--navy); text-align: center; font-weight: 800; }
    p.lead { margin: 0 0 20px; font-size: 0.9rem; color: var(--muted); text-align: center; line-height: 1.45; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; font-size: 1rem; border-radius: 12px; border: 1.5px solid var(--border); margin-bottom: 14px; }
    input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(4, 51, 107, 0.12); }
    button { width: 100%; padding: 14px; font-size: 1rem; font-weight: 700; color: #fff; background: linear-gradient(180deg, var(--navy2), var(--navy)); border: none; border-radius: 12px; cursor: pointer; margin-top: 4px; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #msg { margin-top: 14px; font-size: 0.88rem; line-height: 1.45; min-height: 2.5em; text-align: center; }
    #msg.err { color: var(--err); }
    #msg.ok { color: #166534; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="lead">Choose a new password for your QGo account. It must meet the same rules as in the app (length, upper, lower, number, symbol).</p>
    <form id="f">
      <label for="p1">New password</label>
      <input id="p1" type="password" autocomplete="new-password" required />
      <label for="p2">Confirm password</label>
      <input id="p2" type="password" autocomplete="new-password" required />
      <button type="submit" id="btn">Update password</button>
    </form>
    <div id="msg"></div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get("t") || "";
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn");
      if (!token) {
        msg.className = "err";
        msg.textContent = "Missing reset token. Open the link from your email again.";
        btn.disabled = true;
        return;
      }
      document.getElementById("f").addEventListener("submit", async function (e) {
        e.preventDefault();
        msg.className = "";
        msg.textContent = "";
        var p1 = document.getElementById("p1").value;
        var p2 = document.getElementById("p2").value;
        if (p1 !== p2) {
          msg.className = "err";
          msg.textContent = "Passwords do not match.";
          return;
        }
        btn.disabled = true;
        try {
          var base = window.location.origin;
          var res = await fetch(base + "/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, newPassword: p1 }),
          });
          var text = await res.text();
          var j = {};
          try { j = JSON.parse(text); } catch (_) {}
          if (!res.ok) {
            msg.className = "err";
            msg.textContent = (j && j.message) || text || "Request failed.";
            btn.disabled = false;
            return;
          }
          msg.className = "ok";
          msg.textContent = (j && j.message) || "Password updated. Return to the QGo app and sign in.";
        } catch (err) {
          msg.className = "err";
          msg.textContent = "Could not reach the server. Check your connection.";
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
